name: Release TraeChime

on:
  push:
    tags: ["v*"]          # 推送 v 开头 tag 时触发正式发布
  workflow_dispatch: {}   # 支持手动触发（仅构建并上传产物，不创建 Release）

permissions:
  contents: write         # 创建 Release 与上传产物需要写权限

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          swift --version
          sw_vers

      # 防止 tag 与版本号不一致：VERSION 文件是唯一版本来源
      - name: Verify tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(cat VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag(${TAG_VERSION}) 与 VERSION 文件(${FILE_VERSION})不一致，请先更新 VERSION 文件再重新打 tag"
            exit 1
          fi

      - name: Build DMG
        run: ./scripts/make_dmg.sh
        # 当前为 ad-hoc 签名（未公证），仅限本地/内部分发。
        # 后续若接入开发者账号，可在 Secrets 配置证书与公证凭证，
        # 在 make_app.sh / make_dmg.sh 中补充 codesign + notarytool 流程。

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          shasum -a 256 *.dmg > checksums.txt
          cat checksums.txt

      # 手动触发时：产物存为 workflow artifact，便于验证打包流程
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TraeChime-dmg
          path: dist/

      # tag 触发时：创建 GitHub Release 并上传 DMG + 校验文件
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.dmg \
            dist/checksums.txt \
            --title "TraeChime ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "未签名版本（ad-hoc），首次打开需要放行，参见 README 安装章节。SHA-256 校验值见 checksums.txt。"
